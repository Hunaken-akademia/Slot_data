name: Daily slot data update

on:
  schedule:
    - cron: "10 15 * * *" # 00:10 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "package.json"
      - ".github/workflows/daily-slot-data.yml"

permissions:
  contents: write

concurrency:
  group: daily-slot-data
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install parser
        run: npm install --no-audit --no-fund
      - name: Collect missing and recent reports
        run: npm run update
        env:
          MAX_REPORTS: "40"
      - name: Rebuild analytics
        run: npm run build:data
      - name: Validate generated data
        run: npm run validate
      - name: Commit updates
        run: |
          if git diff --quiet -- public/data; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: daily slot update [skip ci]"
          git pull --rebase origin main
          git push
# Backfill pass 2
