name: Daily slot data update

on:
  schedule:
    - cron: "10 15 * * *" # 00:10 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "package.json"
      - ".github/workflows/daily-slot-data.yml"

permissions:
  contents: write

concurrency:
  group: daily-slot-data
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        store: [mitoya-suidobashi, inage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install parser
        run: npm install --no-audit --no-fund
      - name: Collect missing and recent reports
        run: npm run update
        env:
          MAX_REPORTS: "40"
          STORE_SLUG: ${{ matrix.store }}
      - name: Rebuild analytics
        run: npm run build:data
        env:
          STORE_SLUG: ${{ matrix.store }}
      - name: Validate generated data
        run: npm run validate
        env:
          STORE_SLUG: ${{ matrix.store }}
      - name: Commit updates
        env:
          STORE_SLUG: ${{ matrix.store }}
        run: |
          if [ -z "$(git status --porcelain -- public/data)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: ${STORE_SLUG} daily update [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
# Multi-store backfill pass 2
